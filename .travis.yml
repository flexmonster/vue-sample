language: node_js
node_js: '22'
dist: focal

install:
  - cd "$TRAVIS_BUILD_DIR" && npm i && npm run build

before_script:
  - cd "$TRAVIS_BUILD_DIR" && npm run preview -- --port 5173 --strictPort &
  - npx --yes wait-on "http://localhost:5173" --timeout 60000
  - git clone "https://github.com/flexmonster/framework-samples-tests" "$TRAVIS_BUILD_DIR/framework-samples-tests"
  - cd "$TRAVIS_BUILD_DIR/framework-samples-tests" && npm ci && npx playwright install --with-deps chromium
script:
  - cd "$TRAVIS_BUILD_DIR/framework-samples-tests" && BASE_URL="http://localhost:5173" npm test

notifications:
  slack:
    rooms:
      - secure: ""
    on_success: always
    on_failure: always
